services:
  postgres:
    image: postgres:16-alpine
    container_name: church_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: church_admin
      POSTGRES_PASSWORD: church_dev_password
      POSTGRES_DB: church_management
    ports:
      # Host port 5433 -> container 5432. Port 5432 is intentionally avoided
      # because a native PostgreSQL install may already be bound to it on
      # the host machine.
      - "5433:5432"
    volumes:
      - church_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U church_admin -d church_management"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  church_postgres_data:
